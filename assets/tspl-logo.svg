<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tsplNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f233d"/>
      <stop offset="50%" stop-color="#142c4b"/>
      <stop offset="100%" stop-color="#0b1a2e"/>
    </linearGradient>

    <!-- Metallic Gold Accent Gradient -->
    <linearGradient id="tsplGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8bf7a"/>
      <stop offset="40%" stop-color="#d4a359"/>
      <stop offset="100%" stop-color="#ba8236"/>
    </linearGradient>

    <!-- Metallic Platinum Swirl Gradient -->
    <linearGradient id="tsplSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    
    <!-- Subtle Drop Shadow -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Deep Blue Shield Card Background -->
  <rect x="10" y="10" width="500" height="200" rx="10" fill="url(#tsplNavyGrad)" stroke="#091424" stroke-width="2"/>

  <!-- Elegant Double Inner Gold Border -->
  <rect x="24" y="24" width="472" height="172" rx="6" fill="none" stroke="url(#tsplGoldGrad)" stroke-width="2.5" />
  <rect x="29" y="29" width="462" height="162" rx="4" fill="none" stroke="url(#tsplGoldGrad)" stroke-width="0.8" opacity="0.6"/>

  <!-- EMBLEM ICON (Left side: Dynamic Orbital Swirl + Wireframe Globe) -->
  <g transform="translate(60, 48)" filter="url(#subtleShadow)">
    <!-- Lower wing / swoop -->
    <path d="M 5 62 L 68 108 C 88 108 102 96 112 80 C 88 92 70 82 58 74 L 38 62 Z" fill="url(#tsplSilverGrad)"/>
    <!-- Upper wing / swoop -->
    <path d="M 38 48 C 50 40 68 30 92 42 C 82 26 68 14 48 14 L -15 60 L 5 62 Z" fill="url(#tsplSilverGrad)"/>

    <!-- Central Globe Circle -->
    <circle cx="38" cy="62" r="19" fill="#0f233d" stroke="url(#tsplSilverGrad)" stroke-width="2.2"/>
    <!-- Longitude ellipse -->
    <ellipse cx="38" cy="62" rx="9" ry="18.5" fill="none" stroke="url(#tsplSilverGrad)" stroke-width="1.2" opacity="0.85"/>
    <!-- Latitude line -->
    <line x1="19.5" y1="62" x2="56.5" y2="62" stroke="url(#tsplSilverGrad)" stroke-width="1.2" opacity="0.85"/>
    <line x1="23" y1="52" x2="53" y2="52" stroke="url(#tsplSilverGrad)" stroke-width="0.9" opacity="0.6"/>
    <line x1="23" y1="72" x2="53" y2="72" stroke="url(#tsplSilverGrad)" stroke-width="0.9" opacity="0.6"/>

    <!-- Dynamic Tilted Orbital Ring around Globe -->
    <ellipse cx="38" cy="62" rx="26" ry="7.5" transform="rotate(-28 38 62)" fill="none" stroke="url(#tsplSilverGrad)" stroke-width="1.6"/>
  </g>

  <!-- TSPL Wordmark (Classic Golden Serif Display) -->
  <text x="210" y="122" font-family="'Times New Roman', Times, 'Cinzel', 'Playfair Display', serif" font-size="64" font-weight="700" fill="url(#tsplGoldGrad)" letter-spacing="4">TSPL</text>

  <!-- Tagline: "Assurance Delivered" (Refined Italic Serif) -->
  <text x="214" y="156" font-family="'Georgia', 'Times New Roman', serif" font-size="20.5" font-style="italic" font-weight="400" fill="#ffffff" letter-spacing="1.5" opacity="0.95">Assurance Delivered</text>
</svg>
